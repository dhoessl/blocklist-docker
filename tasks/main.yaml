---
- name: "Create log volume"
  containers.podman.podman_volume:
    name: "blocklist_log"
    state: "present"

- name: "Create public volume"
  containers.podman.podman_volume:
    name: "blocklist_public"
    state: "present"
  register: "public_volume"

- name: "Copy Dockerfile"
  ansible.builtin.copy:
    src: "files/Dockerfile"
    dest: "/tmp/blocklist.Dockerfile"
    owner: >-
      {{
        blocklist_docker_dockerfile_owner
        | default(blocklist_docker_owner)
      }}
    group: >-
      {{
        blocklist_docker_dockerfile_group
        | default(blocklist_docker_group)
      }}
    mode: "0644"

- name: "Copy index"
  ansible.builtin.copy:
    src: "files/index.html"
    dest: "{{ public_volume.volume.Mountpoint }}/index.html"
    owner: "www-data"
    group: "www-data"
    mode: "0644"

- name: "Copy Script"
  ansible.builtin.template:
    src: "templates/blocklist-creator.py.j2"
    dest: "/tmp/blocklist-creator.py"
    owner: >-
      {{
        blocklist_docker_script_owner
        | default(blocklist_docker_owner)
      }}
    group: >-
      {{
        blocklist_docker_script_group
        | default(blocklist_docker_group)
      }}

- name: "Create Image from dockerfile"
  containers.podman.podman_image:
    name: "dhoessl/blocklist"
    tag: "latest"
    path: "/tmp"
    build:
      file: "blocklist.Dockerfile"
    state: "present"
    force: true

- name: "Start blocklist container"
  containers.podman.podman_container:
    tls_verify: "{{ blocklist_tls_verify | default(true) }}"
    name: "blocklist"
    image: "localhost/dhoessl/blocklist:lastest"
    state: "started"
    restart_policy: "unless-stopped"
    volume:
      - "blocklist_public:/output"
      - "blocklist_log:/log"

- name: "cleanup tmp files"
  ansible.builtin.file:
    path: "/tmp/{{ item }}"
    state: "absent"
  loop:
    - "blocklist-creator.py"
    - "blocklist.Dockerfile"
...
